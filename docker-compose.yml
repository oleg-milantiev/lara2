services:
    nginx:
        restart: always
        image: nginx:1.28-alpine
        ports:
            - 88:80
        depends_on:
            - php
        volumes:
            - ./lara:/var/www/lara
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    php:
        restart: always
        build:
            context: ./php
            dockerfile: ./Dockerfile
            target: dev
        env_file:
            - .env
        environment:
            - PHP_IDE_CONFIG=serverName=lara2.local
        depends_on:
            - redis
            - postgres
        expose:
            - 9000
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./lara:/var/www/lara

    redis:
        restart: always
        image: redis:7
        expose:
            - 6379

    postgres:
        restart: always
        image: postgres:17-alpine
        ports:
            # for development access only
            - 5433:5432
        expose:
            - 5432
        environment:
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        volumes:
            - ./postgres:/host
            - db-data:/var/lib/postgresql/data

volumes:
    # Postgres data volume
    db-data:

networks:
    appnet:
        driver: bridge
